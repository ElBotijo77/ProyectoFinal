spring:
  application:
    name: medicapp
  # Carga opcional de un .env (formato clave=valor) desde backend/ o desde la raíz del repo.
  # Las variables de entorno reales del sistema tienen prioridad sobre este archivo.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    # El esquema lo gestiona Flyway; Hibernate solo comprueba que las entidades coinciden
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
